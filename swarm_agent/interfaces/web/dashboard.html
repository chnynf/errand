<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swarm Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

  header { padding: 20px 32px; border-bottom: 1px solid #1e2535; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px #22c55e; }

  nav { display: flex; gap: 4px; padding: 16px 32px 0; border-bottom: 1px solid #1e2535; }
  nav button { background: none; border: none; color: #94a3b8; padding: 8px 16px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; }
  nav button.active { color: #e2e8f0; border-bottom-color: #6366f1; }
  nav button:hover { color: #e2e8f0; }

  main { padding: 32px; }
  .tab { display: none; }
  .tab.active { display: block; }

  /* Components */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card { background: #1a1f2e; border: 1px solid #1e2535; border-radius: 10px; padding: 20px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
  .card:hover { border-color: #6366f1; transform: translateY(-1px); }
  .card.selected { border-color: #6366f1; background: #1e2338; }
  .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .card-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; background: #2d3348; }
  .card-title { font-weight: 600; font-size: 15px; }
  .card-desc { font-size: 13px; color: #64748b; line-height: 1.5; }
  .card-links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; background: #2d3348; color: #94a3b8; padding: 2px 8px; border-radius: 4px; }

  /* Detail panel */
  .detail { margin-top: 24px; background: #1a1f2e; border: 1px solid #1e2535; border-radius: 10px; padding: 24px; display: none; }
  .detail.visible { display: block; }
  .detail h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .detail p { font-size: 14px; color: #94a3b8; line-height: 1.6; }

  /* Tokens */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat { background: #1a1f2e; border: 1px solid #1e2535; border-radius: 10px; padding: 20px; }
  .stat-value { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .stat-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
  .cost { color: #f59e0b; }
  .in { color: #6366f1; }
  .out { color: #22c55e; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 12px; color: #64748b; font-weight: 500; border-bottom: 1px solid #1e2535; }
  td { padding: 10px 12px; border-bottom: 1px solid #1a1f2e; }
  tr:hover td { background: #1e2338; }

  /* Config */
  .config-editor { background: #1a1f2e; border: 1px solid #1e2535; border-radius: 10px; padding: 24px; }
  .config-editor h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #94a3b8; }
  .field-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .field-row label { font-size: 13px; color: #94a3b8; width: 180px; flex-shrink: 0; }
  .field-row input, .field-row select { background: #0f1117; border: 1px solid #2d3348; color: #e2e8f0; padding: 6px 10px; border-radius: 6px; font-size: 13px; flex: 1; }
  .field-row input:focus, .field-row select:focus { outline: none; border-color: #6366f1; }
  .save-btn { margin-top: 16px; background: #6366f1; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.15s; }
  .save-btn:hover { background: #4f46e5; }
  .save-msg { font-size: 13px; color: #22c55e; margin-left: 12px; opacity: 0; transition: opacity 0.3s; }
  .save-msg.show { opacity: 1; }
  .section-title { font-size: 13px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; margin: 24px 0 12px; }
</style>
</head>
<body>

<header>
  <div class="dot" id="statusDot"></div>
  <h1>Swarm</h1>
</header>

<nav>
  <button class="active" onclick="showTab('components', this)">Components</button>
  <button onclick="showTab('tokens', this)">Tokens</button>
  <button onclick="showTab('sessions', this)">Sessions</button>
  <button onclick="showTab('config', this)">Config</button>
</nav>

<main>

  <!-- Components Tab -->
  <div class="tab active" id="tab-components">
    <div class="grid" id="componentGrid"></div>
    <div class="detail" id="componentDetail">
      <h2 id="detailTitle"></h2>
      <p id="detailDesc"></p>
      <div class="card-links" id="detailLinks"></div>
    </div>
  </div>

  <!-- Tokens Tab -->
  <div class="tab" id="tab-tokens">
    <div class="stats">
      <div class="stat"><div class="stat-value in" id="totalInput">—</div><div class="stat-label">Input Tokens</div></div>
      <div class="stat"><div class="stat-value out" id="totalOutput">—</div><div class="stat-label">Output Tokens</div></div>
      <div class="stat"><div class="stat-value cost" id="totalCost">—</div><div class="stat-label">Estimated Cost</div></div>
    </div>
    <table>
      <thead><tr><th>Date</th><th>Input Tokens</th><th>Output Tokens</th><th>Cost</th></tr></thead>
      <tbody id="tokenTable"></tbody>
    </table>
  </div>

  <!-- Sessions Tab -->
  <div class="tab" id="tab-sessions">
    <table>
      <thead><tr><th>Session</th><th>Agent</th><th>Messages</th><th>Input Tokens</th><th>Output Tokens</th><th>Cost</th></tr></thead>
      <tbody id="sessionTable"></tbody>
    </table>
  </div>

  <!-- Config Tab -->
  <div class="tab" id="tab-config">
    <div class="config-editor">
      <h2>Runtime Settings</h2>

      <div class="section-title">Interfaces</div>
      <div class="field-row"><label>Discord enabled</label><select id="cfg-discord"><option value="true">Yes</option><option value="false">No</option></select></div>
      <div class="field-row"><label>CLI enabled</label><select id="cfg-cli"><option value="true">Yes</option><option value="false">No</option></select></div>
      <div class="field-row"><label>Web enabled</label><select id="cfg-web"><option value="true">Yes</option><option value="false">No</option></select></div>

      <div class="section-title">Scheduler</div>
      <div class="field-row"><label>Scheduler enabled</label><select id="cfg-scheduler"><option value="true">Yes</option><option value="false">No</option></select></div>
      <div class="field-row"><label>Poll interval (seconds)</label><input type="number" id="cfg-poll" min="1"></div>

      <div class="section-title">Agents</div>
      <div class="field-row"><label>Default agent</label><input type="text" id="cfg-default-agent"></div>

      <button class="save-btn" onclick="saveConfig()">Save</button>
      <span class="save-msg" id="saveMsg">Saved.</span>
    </div>
  </div>

</main>

<script>
const ICONS = { config:"⚙️", contracts:"📋", interfaces:"🔌", runtime:"🏗️", sessions:"💾", agent_loop:"🔄", brain:"🧠", tools:"🛠️", scheduler:"⏰" };

function showTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'tokens') loadTokens();
  if (id === 'sessions') loadSessions();
  if (id === 'config') loadConfig();
}

// Components
async function loadComponents() {
  const res = await fetch('/api/components');
  const { components } = await res.json();
  const grid = document.getElementById('componentGrid');
  grid.innerHTML = '';
  components.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon">${ICONS[c.id] || '📦'}</div>
        <div class="card-title">${c.label}</div>
      </div>
      <div class="card-desc">${c.description}</div>
      ${c.connects_to.length ? `<div class="card-links">${c.connects_to.map(t => `<span class="tag">→ ${t}</span>`).join('')}</div>` : ''}
    `;
    card.onclick = () => showDetail(c, card);
    grid.appendChild(card);
  });
}

function showDetail(c, card) {
  document.querySelectorAll('.card').forEach(el => el.classList.remove('selected'));
  card.classList.add('selected');
  document.getElementById('detailTitle').textContent = c.label;
  document.getElementById('detailDesc').textContent = c.description;
  const links = document.getElementById('detailLinks');
  links.innerHTML = c.connects_to.map(t => `<span class="tag">→ ${t}</span>`).join('');
  document.getElementById('componentDetail').classList.add('visible');
}

// Tokens
async function loadTokens() {
  const res = await fetch('/api/tokens');
  const data = await res.json();
  document.getElementById('totalInput').textContent = fmt(data.total_input_tokens);
  document.getElementById('totalOutput').textContent = fmt(data.total_output_tokens);
  document.getElementById('totalCost').textContent = '$' + data.total_cost_usd.toFixed(4);
  const tbody = document.getElementById('tokenTable');
  tbody.innerHTML = '';
  Object.entries(data.by_day).sort((a,b) => b[0].localeCompare(a[0])).forEach(([day, d]) => {
    tbody.innerHTML += `<tr><td>${day}</td><td>${fmt(d.input_tokens)}</td><td>${fmt(d.output_tokens)}</td><td>$${d.total_cost.toFixed(4)}</td></tr>`;
  });
}

// Sessions
async function loadSessions() {
  const res = await fetch('/api/sessions');
  const { sessions } = await res.json();
  const tbody = document.getElementById('sessionTable');
  tbody.innerHTML = '';
  sessions.sort((a,b) => (b.created_at||0) - (a.created_at||0)).forEach(s => {
    const ts = s.token_summary || {};
    tbody.innerHTML += `<tr>
      <td style="font-family:monospace;font-size:12px">${s.session_id}</td>
      <td>${s.agent_id}</td>
      <td>${s.message_count}</td>
      <td>${fmt(ts.input_tokens||0)}</td>
      <td>${fmt(ts.output_tokens||0)}</td>
      <td>$${(ts.total_cost||0).toFixed(4)}</td>
    </tr>`;
  });
}

// Config
async function loadConfig() {
  const res = await fetch('/api/config');
  const cfg = await res.json();
  document.getElementById('cfg-discord').value = String(cfg.interfaces?.discord?.enabled ?? true);
  document.getElementById('cfg-cli').value = String(cfg.interfaces?.cli?.enabled ?? false);
  document.getElementById('cfg-web').value = String(cfg.interfaces?.web?.enabled ?? false);
  document.getElementById('cfg-scheduler').value = String(cfg.scheduler?.enabled ?? true);
  document.getElementById('cfg-poll').value = cfg.scheduler?.poll_seconds ?? 10;
  document.getElementById('cfg-default-agent').value = cfg.default_agent ?? '';
}

async function saveConfig() {
  const patch = {
    interfaces: {
      discord: { enabled: document.getElementById('cfg-discord').value === 'true' },
      cli: { enabled: document.getElementById('cfg-cli').value === 'true' },
      web: { enabled: document.getElementById('cfg-web').value === 'true' },
    },
    scheduler: {
      enabled: document.getElementById('cfg-scheduler').value === 'true',
      poll_seconds: parseInt(document.getElementById('cfg-poll').value, 10),
    },
    default_agent: document.getElementById('cfg-default-agent').value,
  };
  await fetch('/api/config', { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(patch) });
  const msg = document.getElementById('saveMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
}

function fmt(n) {
  return n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n);
}

loadComponents();
</script>
</body>
</html>
